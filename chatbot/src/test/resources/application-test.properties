# ============================================================
# Test Profile - application-test.properties
# Used by: @DataJpaTest, @SpringBootTest(@ActiveProfiles("test"))
# ============================================================

# H2 In-Memory Database (replaces MySQL during tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Disable data.sql for tests (data inserted manually in @BeforeEach)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT (same secret as main)
jwt.secret=ChatSupportSystemSecretKey2026SpringBootProjectSecretKey12345678901234567890
jwt.expiration=3600000

# WebSocket
websocket.allowed-origins=http://localhost:3000
